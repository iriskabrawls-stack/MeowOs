- name: Build ISO inside Arch Linux Docker Container
  run: |
    docker run --privileged --rm -v ${{ github.workspace }}:/workspace archlinux:latest bash -c "
      pacman-key --init
      pacman-key --populate archlinux
      pacman -Syu --noconfirm -y archiso
      mkdir -p /tmp/profile
      cp -r /usr/share/archiso/configs/releng/* /tmp/profile/
      if [ -f /workspace/packages.txt ]; then
        cat /workspace/packages.txt >> /tmp/profile/packages.x86_64
      else
        echo 'Error: packages.txt not found!' && exit 1
      fi
      mkdir -p /tmp/profile/airootfs/etc/skel/
      cp /workspace/.xinitrc /tmp/profile/airootfs/etc/skel/.xinitrc
      chmod +x /tmp/profile/airootfs/etc/skel/.xinitrc
      mkdir -p /tmp/profile/airootfs/etc/systemd/system/multi-user.target.wants/
      ln -sf /usr/lib/systemd/system/NetworkManager.service /tmp/profile/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
      mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /tmp/profile
    "
